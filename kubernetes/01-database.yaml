apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: database }
  template:
    metadata:
      labels: { app: database }
    spec:
      containers:
      - name: database
        image: judithlan/reservavuelos-database:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 3306 }]
        envFrom:
        - secretRef: { name: vuelos-secret }
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: database-pvc }
---
apiVersion: v1
kind: Servicegit
metadata:
  name: database
spec:
  selector: { app: database }
  ports: [{ port: 3306 }]