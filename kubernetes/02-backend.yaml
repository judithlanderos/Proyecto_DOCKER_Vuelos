apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
      - name: backend
        image: judithlan/reservavuelos-backend:latest
        ports: [{ containerPort: 3000 }]
        env:
        - { name: DB_HOST, value: database }
        envFrom:
        - secretRef: { name: vuelos-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
  - port: 3000
    targetPort: 3000